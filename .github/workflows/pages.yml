name: Deploy BetAgree
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Refresh SportyBet matches and odds
        run: |
          for attempt in 1 2 3; do
            if node scripts/refresh-matches.mjs; then
              exit 0
            fi

            echo "SportyBet refresh attempt ${attempt} failed"
            sleep $((attempt * 10))
          done

          echo "Using the last verified live SportyBet feed"
          mkdir -p public/data
          curl --fail --retry 3 --retry-delay 3 \
            https://betagree.com/data/matches.json \
            --output public/data/matches.json
          node -e 'const data = require("./public/data/matches.json"); if (!Array.isArray(data.matches) || data.matches.length === 0) process.exit(1); console.log(`Using ${data.matches.length} last-known SportyBet matches`)'
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare Pages
        run: |
          cp dist/index.html dist/404.html
          echo "betagree.com" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
