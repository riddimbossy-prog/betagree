      - name: Locate static output
        id: out
        run: |
          dir=""
          if [ -f dist/client/_shell.html ]; then
            dir=dist/client
            cp -f dist/client/_shell.html dist/client/index.html
            cp -f dist/client/_shell.html dist/client/404.html
          else
            for d in dist/client dist .output/public; do
              if [ -f "$d/index.html" ] || [ -f "$d/_shell.html" ]; then
                dir=$d
                [ -f "$d/_shell.html" ] && cp -f "$d/_shell.html" "$d/index.html"
                [ -f "$d/index.html" ] && cp -f "$d/index.html" "$d/404.html"
                break
              fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "No static HTML found" >&2
            find . -name '*.html' -not -path './node_modules/*' | head
            exit 1
          fi
          echo "betagree.com" > "$dir/CNAME"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          ls -la "$dir" | head